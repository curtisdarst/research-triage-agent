name: Grounding eval

# Runs the eval harness (eval/run_eval.py) whenever a prompt change might
# affect grounding accuracy, so an edit to synthesize()/validate()'s
# instructions can't silently regress citation accuracy or spike the
# false-refusal rate. See eval/README.md for metric definitions.
#
# Auth is Workload Identity Federation, not a downloaded service-account
# key — see the setup steps in eval/README.md for how the WIF pool,
# provider, and the narrowly-scoped github-actions-eval service account
# (BigQuery Data Viewer + Job User, Vertex AI User only) were created.

on:
  pull_request:
    paths:
      - "agent/**"
      - "eval/**"
      - "requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT }}

      - name: Run grounding eval
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          BQ_TABLE: ${{ vars.BQ_TABLE }}
        run: |
          python eval/run_eval.py \
            --max-unsupported-rate 0.15 \
            --max-false-refusal-rate 0.20

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/latest.json
