  question: "What does the literature say about the effect of prompt engineering patterns on wildlife population monitoring accuracy from camera-trap imagery?"
  expected_status: unanswerable
  notes: "Verified via search_corpus: no ecology/wildlife papers in top-5; one medical-VLM OOD-detection paper appears but is unrelated to wildlife monitoring."

- id: U4
  question: "What does the literature say about the effect of prompt engineering patterns on the biodegradability of packaging materials?"
  expected_status: unanswerable
  notes: "Verified via search_corpus: top-5 results are all about coding-agent prompting; none about materials science."

- id: U5
  question: "What does the literature say about the effect of prompt engineering patterns on museum artifact provenance authentication accuracy?"
  expected_status: unanswerable
  notes: "Verified via search_corpus: top-5 results are all about coding-agent prompting and security; none about museums, provenance, or authentication."

- id: U6
  question: "What does the literature say about the effect of prompt engineering patterns on the translation accuracy of ancient Sumerian cuneiform tablets?"
  expected_status: unanswerable
